    alexander_reinthal:
      - 'Senior Data Engineer, Independent contributor & Open-Source advocate with expertise in real-time data ingestion, data modeling, and orchestrating cloud-based data workloads. Strong background in Apache Flink, Databricks, Dagster, and Snowflake, with proven contributions to open-source tools like Dagster & Dlthub. Passionate about developer experience, mentoring engineers in distributed systems and ML-driven analytics.'
    experience:
    
      - company: Knowit Solutions Cocreate
        position: Data Engineer / Tech Lead / Delivery Manager
        location: Gothenburg, Sweden
        start_date: 2022-02
        end_date: present
        highlights:
          - Led an agile R&D team to build real-time data ingestion pipelines handling massive volumes of CI-pipeline logs using \textbf{Apache Flink (AWS Kinesis/Data Streams equivalent)} & Spark Structured Streaming.
          - Designed scalable data pipelines on Databricks & Snowflake, equivalent to AWS Glue & Athena.
          - Served as the technical lead, engaging with a client to design and implement a modern data platform leveraging Snowflake, Dagster, and dbt.
          - Owned the development of an asset-centric data modeling approach for Databricks & Delta Live Tables, improving streaming data reliability & developer experience.
          - Mentored junior engineers in Python, SQL, and data engineering best practices. Led workshops on modern data engineering best practices, and aligning technical solutions with business objectives.
          - Collaborated with stakeholders to refine data requirements and upstream data contracts.
    
      - company: NTT Security
