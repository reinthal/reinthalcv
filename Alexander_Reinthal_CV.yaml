        position: Data Engineer / Tech Lead / Delivery Manager
        location: Gothenburg, Sweden
        start_date: 2022-02
        end_date: present
        highlights:
          - Led an agile R\&D team to build \textbf{real-time data ingestion pipelines} handling massive volumes of CI-pipeline logs using \textbf{Apache Flink (AWS Kinesis/Data Streams equivalent)} \& \textbf{Spark Structured Streaming.}
          - \textbf{Designed scalable data pipelines} on \textbf{Databricks \& Snowflake}, equivalent to \textbf{AWS Glue \& Athena}, enabling advanced analytics workloads.
          - Served as the \textbf{technical lead}, engaging with a client to \textbf{design and implement a modern data platform} leveraging \textbf{Snowflake, Dagster, and dbt}.
          - Owned the \textbf{development of an asset-centric data modeling approach} for \textbf{Databricks \& Delta Live Tables}, enhancing \textbf{streaming data reliability \& developer experience.}
          - \textbf{Mentored junior engineers} in \textbf{Python, SQL, DAG-based orchestration, and modern data engineering best practices.} Led workshops on aligning \textbf{technical solutions with business objectives.}
          - \textbf{Collaborated with stakeholders} to \textbf{refine data governance, enforce upstream data contracts, and improve real-time data visibility.}

      - company: NTT Security
        position: Security Analyst
