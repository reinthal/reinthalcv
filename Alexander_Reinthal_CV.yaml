          - 'Prototyped high-volume data ingestion with real-time processing from network interfaces using Apache Flink and AWS S3 Backed Iceberg tables.'
       
      - name: Datalake Stack
        date: '[github.com/reinthal/datalake-stack](https://github.com/reinthal/datalake-stack)'
        highlights:
