cv:
  name: Alexander Reinthal
  location: Gothenburg, Sweden
  email: email@reinthal.me
  phone: "+46709186850"
  website: https://reinthal.me/
  social_networks:
    - network: LinkedIn
      username: alexander-reinthal
    - network: GitHub
      username: reinthal
  sections:
    _:
      - 7 years of industry experience - cybersecurity operations - machine learning - data science & engineering
    publications:
      - title: Data Modelling for Predicting Exploits
        authors:
          - 'Reinthal, A'
          - 'Filippakis, E.'
          - 'Almgren, M.'
        doi: 10.1007/978-3-030-03638-6_21
        url: https://link.springer.com/chapter/10.1007/978-3-030-03638-6_21
        journal: 'Springer LNCS: Nordic Conference on Secure IT Systems'
        date: 2018-11
        summary: "Peer-reviewed research. Published a methodology paper that was adopted by Recorded Future, a threat intelligence company. Today, they report their Vulnerability Intelligence customers see: 86% reduction in unplanned downtime, 11 hours saved weekly on alert triage, investigation, and response, 73% increase in visibility into potential threats."
        highlights:
          - '[Data Modeling for Predicting Software Exploits](https://link.springer.com/chapter/10.1007/978-3-030-03638-6_21)'
          - "[Recorded Future's Vulnerability Management solution](https://www.recordedfuture.com/products/vulnerability-intelligence)"
          - '[Latex for the Paper](https://github.com/reinthal/exploit-prediction)'
    research_projects:
      - name: '[Detecting Piecewise Cyber Espionage in Model APIs](https://apartresearch.com/project/detecting-piecewise-cyber-espionage-in-model-apis-a8gx)'
        date:
        start_date: 2025-11
        end_date: 2025-11
        location:
        summary: 'Apart Research sprint (4th place out of 641 submissions) studying detection of piecewise misuse activity in model APIs'
        highlights:
          - 'Showed that piecewise misuse — where individual requests appear benign — can be detected by modelling activity using the cyber kill chain'
          - 'Correlated data across requests (e.g. IP addresses) to surface patterns that per-request guardrails like Llama Guard 3 miss'
          - 'Co-authored with Arthur Colle, David Williams-King, Yingquan Li, and Lihn Le'
      - name: '[Detecting Deception in Chinese Models](https://github.com/reinthal/deception-detection-in-chinese-modelsels)'
        date:
        start_date: 2026-01
        end_date: 2026-02
        location:
        summary: 'ARENA 7.0 weekend hackathon (1st place) applying linear probing to detect deception and political censorship in Chinese-origin language models'
        highlights:
          - 'Extended "Detecting Strategic Deception Using Linear Probes" to Qwen 2.5 models, achieving AUROC 0.849 on deception detection'
          - 'Investigated whether deception and political censorship share the same linear representation in activation space using custom datasets on politically sensitive topics'
          - 'Found optimal layers for probes, conducted steering experiments, and increased deception with model size (7B to 32B), with larger models showing cleaner deception-score separation between non-sensitive and sensitive topics'
          - 'Discovered that Qwen spontaneously switches to Chinese when asked sensitive questions in English, consistent with a refusal/anti-jailbreaking mechanism'
      - name: '[Inoculation Prompting for Emergent Misalignment](https://github.com/reinthal/about-emergent-misalignment)'
        date:
        start_date: 2026-01
        end_date: 2026-04
        location:
        summary: 'ARENA 7.0 capstone project (3rd place) investigating whether inoculation prompting can prevent or reverse emergent misalignment (EM) in fine-tuned LLMs'
        highlights:
          - 'Inoculation (prepending "please be harmful" to training data) completely prevents EM: 0% EM across all 3 domains and encodings vs 17–34% in controls (2x5 experiment, n=2000 each)'
          - 'Discovered on-policy neutral data amplifies EM (+10pp) even when judge-screened as benign, while same questions answered by base model eliminate EM (0%), proving misalignment signal lives in EM model completions'
          - 'Identified correctness confound: EM degrades capabilities by 68pp on GSM8K, and any correct-data SFT simultaneously restores capabilities and reduces EM, making effects inseparable'
      - name: 'Novel AI Control Protocol Classes: Evaluation and Scalability'
        date:
        start_date: 2026-01
        end_date: present
        location:
        summary: 'Ongoing AI safety research through AI Safety Camp, investigating alternative control protocol classes and their scaling properties as model capabilities increase'
        highlights:
          - 'Building on Greenblatt et al.''s control evaluation framework to evaluate hierarchical and parallel control structures against simple trusted-untrusted model pairs'
          - 'Researching whether complex oversight structures offer more safety-usefulness Pareto frontiers, particularly as the capability gap between trusted and untrusted models widens'
          - 'My contributions were researching various meta red-teaming techniques and finding which models did were best to mitigate refusals.'
    Certificates:
      - bullet: 'Bluedot Technical AI safety, Completed: 2026-03-21'
      - bullet: 'Bluedot AGI Strategy, Completed: 2025-10-07'
    experience:
      - company: Bluedot Impact
