cv:
  name: Alexander Reinthal
  location: Gothenburg, Sweden
  email: email@reinthal.me
  phone: "+46709186850"
  website: https://reinthal.me/
  social_networks:
    - network: LinkedIn
      username: alexander-reinthal
    - network: GitHub
      username: reinthal
  sections:
    _:
      - "Cybersecurity ML engineer moving into frontier AI safety. 7 years building classifiers and detection pipelines for malicious traffic and software vulnerabilities (NTT Security; peer-reviewed exploit-prediction methodology adopted by Recorded Future). Recent AI safety work: 1st place ARENA 7.0 hackathon on deception probes, 4th of 641 at Apart Research on cross-request misuse detection in model APIs, and experience from AI control research at AI Safety Camp."
    publications:
      - title: Data Modeling for Predicting Software Exploits
        authors:
          - 'Reinthal, A.'
          - 'Filippakis, E.'
          - 'Almgren, M.'
        doi: 10.1007/978-3-030-03638-6_21
        url: https://link.springer.com/chapter/10.1007/978-3-030-03638-6_21
        journal: 'Springer LNCS: Nordic Conference on Secure IT Systems'
        date: 2018-11
        summary: "Peer-reviewed methodology paper for predicting which CVEs become exploited in the wild — adopted by Recorded Future (threat-intelligence vendor) and shipped as the core of their Vulnerability Intelligence product. End-to-end example of research → scalable production system for cybersecurity ML."
        highlights:
          - 'Recorded Future Vulnerability Intelligence customers report 86% reduction in unplanned downtime, 11 hours/week saved on triage, and 73% increase in threat visibility.'
          - '"We typically see 5–10 CVEs a month escalated automatically, saving the team roughly 3–5 hours gathering information manually." — Senior Engineer / Threat Analyst, Recorded Future customer.'
          - '[Paper](https://link.springer.com/chapter/10.1007/978-3-030-03638-6_21) · [Recorded Future Vulnerability Intelligence](https://www.recordedfuture.com/products/vulnerability-intelligence) · [LaTeX source](https://github.com/reinthal/exploit-prediction)'
    research_projects:
      - name: '[Detecting Piecewise Cyber Espionage in Model APIs](https://apartresearch.com/project/detecting-piecewise-cyber-espionage-in-model-apis-a8gx)'
        date:
        start_date: 2025-11
        end_date: 2025-11
        location:
        summary: 'Apart Research sprint, 4th of 641 submissions. Cross-context monitoring across model-API user sessions — directly analogous to detecting coordinated harms in production frontier deployments.'
        highlights:
          - 'Showed that piecewise misuse — individual requests that look benign in isolation — can be detected by modelling activity across the cyber kill chain.'
          - 'Aggregated signals across disparate requests (e.g. IP correlation) to surface attack patterns that per-request guardrails like Llama Guard 3 miss.'
          - 'Co-authored with Arthur Colle, David Williams-King, Yingquan Li, and Lihn Le.'
      - name: 'Novel AI Control Protocol Classes: Evaluation and Scalability'
        date:
        start_date: 2026-01
        end_date: present
        location:
        summary: 'AI Safety Camp research. Studied whether hierarchical and parallel control structures offer better safety-usefulness Pareto frontiers than simple trusted-untrusted pairs as the capability gap widens.'
        highlights:
          - 'Owned red-teaming work-stream: identified which open-weight models best bypass refusal training to use as untrusted models in control evals.'
      - name: '[Detecting Deception in Chinese Models](https://github.com/reinthal/deception-detection-in-chinese-models)'
        date:
        start_date: 2026-01
        end_date: present
        location:
        summary: 'ARENA 7.0 weekend hackathon, 1st place. Linear probes for deception and politically sensitive lying across frontier open-weight models.'
        highlights:
          - 'Linear probes for deception transfer to Llama-3.3-70B (AUROC > 0.74) but fail on Qwen-2.5-72B (AUROC < 0.5) while Qwen is more China-aligned on evals than Llama-3.3. A curious gap that warrants further research. Ongoing.'
          - 'Awarded a Bluedot Impact rapid grant to extend the work to additional frontier open-weight models.'
      - name: '[About Emergent Misalignment](https://github.com/reinthal/about-emergent-misalignment)'
        date:
        start_date: 2026-01
        end_date: present
        location:
        summary: 'ARENA 7.0 capstone, 3rd place. SFT-based study of how emergent misalignment couples to capability degradation.'
        highlights:
          - 'Fine-tuned model organisms via SFT; showed emergent misalignment degrades capabilities by 68pp on GSM8K and that any correct-data SFT simultaneously restores capabilities and reduces EM — effects are inseparable under this training recipe.'
    experience:
      - company: Bluedot Impact
        position: Facilitator
        date:
        start_date: 2026-03-16
        end_date: present
        summary:
        highlights:
          - 'Part-time facilitator and mentor for the Technical AI Safety course and project track; consistent outstanding feedback from course participants.'
      - company: ARENA 7.0
        position: Alum
        date:
        start_date: 2026-01
        end_date: 2026-02
        summary:
        highlights:
          - 'Research projects placed 1st (Detecting Deception in Chinese Models) and 3rd (Inoculation Prompting Against Emergent Misalignment).'
          - 'Five-week intensive curriculum on transformer internals, mechanistic interpretability, RLHF, evals, JAX, and the Inspect framework — taught by leading AI safety researchers.'
      - company: Knowit Solutions Cocreate
        position: Data Platform Engineer / Tech Lead / Data Scientist
        date:
        start_date: 2022-02
        end_date: present
        location: Gothenburg, Sweden
        summary:
        highlights:
          - 'Implemented an OAuth-authenticated MCP gateway to secure agentic workflows — controlling tool access and authenticating model-side calls against downstream APIs.'
          - 'Compared LLM observability tooling (LangChain, Langfuse, Arize Phoenix) for a job-ad-to-consultant matching platform; deployed Arize Phoenix to production for LLM-call monitoring and model-performance tracking. Mentored junior engineers.'
      - company: NTT Security
        position: Security Analyst
        date:
        start_date: 2019-04
        end_date: 2022-01
        location: Gothenburg, Sweden
        summary:
        highlights:
          - 'Built ML classifiers and anomaly-detection pipelines for malicious network traffic across high-volume customer environments using Python and distributed processing.'
          - 'Designed alert-triage automation; mentored junior analysts on threat intelligence, anomaly detection, and triage workflows.'
      - company: Ericsson
        position: Python Software Engineer
        date:
        start_date: 2017-06
        end_date: 2018-10
        location: Gothenburg, Sweden
        summary:
        highlights:
          - 'Led a team building a log-parsing and analytics tool that grew into a dedicated Ericsson engineering team.'
    open_source_and_personal_projects:
      - name: '[Scheming Propensity Evals on Gemini 3.1 Pro](https://github.com/reinthal/scheming-propensity)'
        date:
        start_date: 2026-05
        end_date: present
        location:
        summary: 'Preparing scheming-propensity evaluations for upstreaming to Inspect Framework, following the methodology from [arXiv:2603.01608](https://arxiv.org/pdf/2603.01608).'
        highlights:
          - 'Implemented the eval suite in Inspect and validated it against Gemini 3.1 Pro. Used to establish baselines on open-source models for model organisms research.'
      - name: '[Casually Jailbreaking Gemini 2.5 Flash](https://www.reinthal.me/posts/casually-jailbreaking-gemini25-flash/)'
        date:
        start_date: 2026
        end_date: 2026
        location:
        summary: 'Jailbroke Gemini 2.5 Flash with a few-shot in-context continuation attack, eliciting harmful recommendations.'
        highlights:
          - 'Practical demonstration of adversarial-robustness gaps in a production frontier model — directly relevant to the team''s automated red-teaming and multi-turn attack work.'
      - name: 'Open Source Contributions'
        date:
        start_date:
        end_date:
        location:
        summary: 'Data-engineering contributions: [Dagster PR #24188](https://github.com/dagster-io/dagster/pull/24188) (ML pipeline orchestration) and [DLT Hub PR #594](https://github.com/dlt-hub/verified-sources/pull/594) (ingestion reliability). Full activity: [github.com/reinthal](https://github.com/reinthal).'
        highlights: []
    skills:
      - label: Machine Learning & AI
        details: 'PyTorch, JAX (learned during ARENA 7.0), Einops, XGBoost, SciKit Learn, Jupyter; LLM evals & observability (Inspect, LangChain, Langfuse, Arize Phoenix); linear probes, SFT, automated red-teaming'
      - label: Programming Languages
        details: 'Python, JavaScript, SQL, Rust, C/C++, R, Nix, Terraform'
      - label: Platforms & Tools
        details: 'Modal, Runpod, Openweights, Weights & Biases, Spark, Flink, Iceberg, Databricks, Dagster, Snowflake, dbt, Apache Superset'
      - label: Infrastructure & DevOps
        details: 'Nix, Docker, Kubernetes, FluxCD, GitOps, CI/CD pipelines, Terraform, AWS (EC2, S3, IAM)'
      - label: Certifications
        details: 'Bluedot Impact — Technical AI Safety (2026-03); AGI Strategy (2025-10)'
    education:
