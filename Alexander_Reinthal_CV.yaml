          - \textbf{Automated security alert processing}, optimizing real-time event analysis and reducing \textbf{response times by X\%}.
          - Designed \textbf{Python-based data ingestion and processing workflows}, akin to \textbf{real-time ETL pipelines} in modern data engineering.
          - \textbf{Provided mentorship \& security training}, educating analysts on \textbf{threat intelligence, anomaly detection, and alert triage automation}.

      - company: Ericsson
        position: Python Software Engineer
        location: Gothenburg, Sweden
        start_date: 2017-06
        end_date: 2018-10
        highlights:
          - Led a team to develop a \textbf{log parsing and analytics tool} that \textbf{scaled into a dedicated engineering team at Ericsson.}
          - \textbf{Automated data workflow optimizations} in Python, improving efficiency in log-based machine-generated data.

    projects:
