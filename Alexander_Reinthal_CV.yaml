cv:
  name: Alexander Reinthal
  location: Gothenburg, Sweden
  email: email@reinthal.me
  phone: "+46709186850"
  website: https://reinthal.me/
  social_networks:
    - network: LinkedIn
      username: alexander-reinthal
    - network: GitHub
      username: reinthal
  sections:
    _:
      - "I am an independent AI safety researcher studying how models become subtly misaligned during training. I bring 7 years of industry experience across cyber-security, data, and ML engineering."
    research_projects:
      - name: "[Testing Scheming Drivers on Instrumental Convergence Evals](https://reinthal.github.io/scheming_drivers/)"
        date:
        start_date: 2026-05
        end_date: 2026-06
        location:
        summary: "What happens to instrumental convergence evals when you change the prompt?"
        highlights:
          - "Found that pressure phrases like 'achieve your goal in the long run' have opposite effects on misalignment rates in Gemini 3.1 Pro depending on prompt styles (1) [He et al. (2025)](https://arxiv.org/pdf/2502.12206) capability prompt and (2) [Hopman et al. (2026)](https://arxiv.org/pdf/2603.01608) propensity prompt. Pressure phrases increased the misalignment rate for (1) +0.23 [+0.19, +0.28] but decreased for (2) −0.10 [−0.15, −0.05] 95% Newcombe CI."
      - name: "[Detecting Deception in Chinese Models](https://github.com/reinthal/deception-detection-in-chinese-models)"
        date:
        start_date: 2026-01
        end_date: present
        location:
        summary: "Are Chinese models lying in their answers on politically sensitive questions?"
        highlights:
          - "TODO."
          - "Awarded a Bluedot Impact rapid grant to extend the work to additional frontier open-weight models."
          - "ARENA 7.0 weekend hackathon, 1st place."
      - name: "[About Emergent Misalignment](https://github.com/reinthal/about-emergent-misalignment)"
        date:
        start_date: 2026-01
        end_date: present
        location:
        summary: "ARENA 7.0 capstone, 3rd place. Investigating how emergent misalignment trades off against model capabilities."
        highlights:
          - "Found that emergent misalignment (EM) rate is negatively correlated on the capability benchmarks GSM8K (pearson -0.98) and MMLU (pearson −0.94) when induced by training on increasing percentages of bad medical advice. Also found that any correct-data SFT restores capabilities and reduces EM."
      - name: "[Detecting Piecewise Cyber Espionage in Model APIs](https://apartresearch.com/project/detecting-piecewise-cyber-espionage-in-model-apis-a8gx)"
        date:
        start_date: 2025-11
        end_date: 2025-11
        location:
        summary: "Apart Research sprint, 4th of 641 submissions — proof of concept for detecting malicious activity across multiple agent sessions."
        highlights:
          - "Individual requests can look benign in isolation (100% to 23% detection by LlamaGuard 3 on IP scans) — but can be detected by modelling activity across user sessions."
          - "Co-authored with Arthur Colle, David Williams-King, Yingquan Li, and Lihn Le."
    experience:
      - company: Independent
        position: AI Safety Researcher
        date:
        start_date: 2026-05-01
