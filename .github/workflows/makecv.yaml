name: Build CV
on:
  push:
    paths:
      - 'Alexander_Reinthal_CV.yaml'
      - '.github/workflows/makecv.yaml'
      - 'pyproject.toml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12.6'

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: latest
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Install dependencies
        run: poetry install

      - name: Build CV
        run: |
          poetry run rendercv render Alexander_Reinthal_CV.yaml

      - name: Configure Git
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git status

      - name: Commit and push generated CV files
        run: |
          cp rendercv_output/Alexander_Reinthal_CV.md README.md
          git add -u
          git commit -m "Update CV files" || echo "No changes to commit!"
          git push

